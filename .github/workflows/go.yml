name: Go CI

on:
    push:
    pull_request:

jobs:
  build-and-test:
    name: Build, Vet and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Build all tasks
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -v ./...